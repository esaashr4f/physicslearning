<meta charset="utf-8">
<title>H156 Paper Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: an exam-room bench. Graph-paper ground, question paper on the left, examiner's red-pen mark scheme on the right,
   question index as a strip of tabs between them. Insights is a long-form report on the same paper. */
:root {
  --paper: #EEF3F6;
  --surface: #FFFFFF;
  --surface-2: #F6F9FB;
  --ink: #0F1F2D;
  --ink-2: #4B5E6F;
  --ink-3: #7A8C9C;
  --rule: #D3DEE6;
  --grid: rgba(38, 104, 150, 0.075);
  --accent: #1F56C9;
  --accent-soft: rgba(31, 86, 201, 0.10);
  --pen: #C8322A;
  --pen-soft: rgba(200, 50, 42, 0.09);
  --shadow: 0 1px 2px rgba(15, 31, 45, .06), 0 8px 24px -12px rgba(15, 31, 45, .18);
  --page-shadow: 0 1px 2px rgba(15,31,45,.10), 0 10px 30px -14px rgba(15,31,45,.35);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0A131D; --surface: #101C29; --surface-2: #0D1823; --ink: #E4ECF3; --ink-2: #9AACBD; --ink-3: #6B7F92;
    --rule: #20324A; --grid: rgba(110, 165, 220, 0.07); --accent: #79A6FF; --accent-soft: rgba(121,166,255,.13);
    --pen: #FF7A6B; --pen-soft: rgba(255,122,107,.12);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -12px rgba(0,0,0,.6);
    --page-shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 40px -16px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0A131D; --surface: #101C29; --surface-2: #0D1823; --ink: #E4ECF3; --ink-2: #9AACBD; --ink-3: #6B7F92;
  --rule: #20324A; --grid: rgba(110, 165, 220, 0.07); --accent: #79A6FF; --accent-soft: rgba(121,166,255,.13);
  --pen: #FF7A6B; --pen-soft: rgba(255,122,107,.12);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -12px rgba(0,0,0,.6);
  --page-shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 40px -16px rgba(0,0,0,.8);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 14px/1.5 var(--f-body);
  overflow: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
#root { height: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---------- app frame ---------- */
.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); min-height: 0; }
.top {
  position: relative; display: flex; align-items: center; gap: 20px;
  padding-block: 10px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  background: var(--surface); border-bottom: 1px solid var(--rule); overflow: hidden;
}
.top canvas.wave { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .55; }
.brand { position: relative; display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand .code { font: 600 11px/1 var(--f-mono); letter-spacing: .08em; padding: 4px 6px; border: 1px solid var(--ink); border-radius: 4px; }
.brand h1 { margin: 0; font: 800 20px/1 var(--f-display); letter-spacing: -.01em; }
.brand h1 span { color: var(--ink-3); font-weight: 500; }
.tabs { position: relative; display: flex; gap: 4px; padding: 3px; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 999px; margin-left: auto; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 500; color: var(--ink-2); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

/* ---------- session rail ---------- */
.rail {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-block: 10px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  border-bottom: 1px solid var(--rule); background: color-mix(in srgb, var(--surface) 70%, transparent);
  backdrop-filter: blur(8px);
}
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button b { font: 600 13px/1.2 var(--f-body); }
.seg button small { font-size: 11px; color: var(--ink-3); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); }
.seg button[aria-pressed="true"] b { color: var(--accent); }
.sessions { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; padding-block: 2px; }
.sessions::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--rule); background: var(--surface); border-radius: 7px; padding: 5px 9px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; line-height: 1.1; transition: border-color .2s, transform .2s;
}
.chip:hover { border-color: var(--ink-3); transform: translateY(-1px); }
.chip .y { font: 600 13px/1.1 var(--f-mono); }
.chip .m { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); }
.chip[aria-pressed="true"] .y, .chip[aria-pressed="true"] .m { color: var(--surface); }

/* ---------- question strip ---------- */
.bench { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
.qstrip {
  display: flex; align-items: center; gap: 10px; padding-block: 8px;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); border-bottom: 1px solid var(--rule); min-width: 0;
}
.qstrip .lbl { font: 600 10px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); flex: none; }
.qlist { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; min-width: 0; padding-bottom: 2px; }
.qbtn {
  flex: none; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 3px 7px; cursor: pointer;
  font: 500 12px/1.2 var(--f-mono); color: var(--ink-2); display: inline-flex; gap: 5px; align-items: baseline;
}
.qbtn sup { font-size: 9px; color: var(--pen); }
.qbtn:hover { border-color: var(--rule); background: var(--surface); }
.qbtn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.qbtn.lor { color: var(--pen); }
.qstrip .empty { color: var(--ink-3); font-size: 12px; }

/* ---------- panes ---------- */
.panes { --split: 50%; display: grid; grid-template-columns: minmax(0, var(--split)) 10px minmax(0, 1fr); min-height: 0; padding-block: 10px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); gap: 0; }
.pane { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; background: var(--surface-2); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.pane-bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--rule); background: var(--surface); min-width: 0; }
.pane-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pane-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.pane.ms .pane-title .dot { background: var(--pen); }
.pane-title b { font: 700 14px/1.1 var(--f-display); white-space: nowrap; }
.pane-title span { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tools { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.ib { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; height: 28px; min-width: 28px; padding: 0 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.ib:hover { border-color: var(--ink-3); color: var(--ink); }
.ib[aria-pressed="true"] { border-color: var(--pen); color: var(--pen); background: var(--pen-soft); }
.pageno { font: 500 12px/1 var(--f-mono); color: var(--ink-2); padding: 0 6px; white-space: nowrap; }
.scroller { position: relative; overflow: auto; min-height: 0; overscroll-behavior: contain; }
.content { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; min-width: min-content; }
.page { position: relative; background: #fff; box-shadow: var(--page-shadow); border-radius: 2px; flex: none; }
.page canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 2px; }
.page .pn { position: absolute; left: -2px; top: 6px; transform: translateX(-100%); font: 500 10px/1 var(--f-mono); color: var(--ink-3); padding-right: 6px; }
.page.flash::after { content: ""; position: absolute; inset: -4px; border: 2px solid var(--accent); border-radius: 4px; pointer-events: none; animation: flash 1.4s ease-out forwards; }
.pane.ms .page.flash::after { border-color: var(--pen); }
@keyframes flash { 0% { opacity: 1 } 100% { opacity: 0 } }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); font: 500 12px var(--f-mono); pointer-events: none; }
.cover {
  position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; text-align: center;
  background: color-mix(in srgb, var(--surface-2) 55%, transparent); backdrop-filter: blur(14px) saturate(.6);
}
.cover-card { display: grid; gap: 10px; justify-items: center; max-width: 280px; padding: 20px; }
.cover-card .stamp { font: 800 12px/1 var(--f-mono); letter-spacing: .2em; color: var(--pen); border: 2px solid var(--pen); padding: 8px 12px; border-radius: 4px; transform: rotate(-4deg); }
.cover-card p { margin: 0; color: var(--ink-2); font-size: 13px; }
.btn { border: 0; background: var(--ink); color: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
.btn.pen { background: var(--pen); color: #fff; }
.divider { cursor: col-resize; display: grid; place-items: center; touch-action: none; }
.divider i { width: 3px; height: 40px; border-radius: 3px; background: var(--rule); transition: background .2s, height .2s; }
.divider:hover i, .divider.drag i { background: var(--accent); height: 64px; }
.mob-switch { display: none; }
.pane-wrap { position: relative; display: grid; min-height: 0; min-width: 0; }
.qpop {
  position: fixed; z-index: 50; max-width: 320px; pointer-events: none; background: var(--ink); color: var(--surface);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.4; box-shadow: var(--shadow);
}
.qpop b { font-family: var(--f-mono); }
.qpop .t { opacity: .7; font-family: var(--f-mono); font-size: 11px; }

@media (max-width: 760px) {
  .brand h1 span { display: none; }
  .panes { grid-template-columns: minmax(0, 1fr); }
  .divider { display: none; }
  .pane-wrap.hide-mob { display: none; }
  .mob-switch { display: inline-flex; }
  .rail { gap: 10px; }
  .seg button small { display: none; }
}
@media (max-width: 560px) {
  .brand h1 { display: none; }
  .top { gap: 10px; }
  .tabs { overflow-x: auto; scrollbar-width: none; min-width: 0; }
  .tabs button { padding: 6px 9px; font-size: 12.5px; flex: none; }
}

/* ---------- question bench ---------- */
.qb { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 0; }
.qnav { border-right: 1px solid var(--rule); overflow: auto; padding-block: 14px 28px; padding-left: var(--gutter-l); padding-right: 12px; display: grid; align-content: start; gap: 16px; background: color-mix(in srgb, var(--surface) 55%, transparent); }
.qnav .grp { display: grid; gap: 3px; }
.qnav .grp > span { font: 600 10px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); padding: 0 6px 6px; }
.qnav .mcq { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; }
.qn { border: 1px solid transparent; background: none; border-radius: 6px; padding: 6px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; cursor: pointer; font: 500 13px/1.2 var(--f-mono); color: var(--ink-2); text-align: left; flex: none; }
.qnav .mcq .qn { justify-content: center; padding: 6px 0; }
.qn small { color: var(--ink-3); font-size: 11px; }
.qn i { font-style: normal; color: var(--pen); font-size: 10px; }
.qn:hover { background: var(--surface); border-color: var(--rule); }
.qn.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.qn.on small, .qn.on i { color: color-mix(in srgb, var(--surface) 75%, transparent); }
.qmain { overflow: auto; min-height: 0; }
.qcard { max-width: 1340px; margin: 0 auto; padding-block: 22px 96px; padding-left: 24px; padding-right: var(--gutter-r); display: grid; gap: 20px; }
.qhead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; }
.qhead h2 { margin: 0; font: 800 clamp(30px, 4vw, 46px)/1 var(--f-display); letter-spacing: -.02em; }
.qhead h2 small { display: block; margin-bottom: 8px; font: 600 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.qhead .meta { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font: 500 11px/1 var(--f-mono); padding: 5px 8px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); white-space: nowrap; }
.pill.mk { border-color: var(--pen); color: var(--pen); }
.pill.ty { border-color: var(--accent); color: var(--accent); }
.qhead .nav { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.colhead, .qrowx { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 22px; }
.colhead { font: 600 10px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); border-bottom: 1px solid var(--rule); padding-bottom: 8px; }
.colhead span:last-child { color: var(--pen); }
.qrowx { align-items: start; padding-top: 4px; scroll-margin-top: 16px; }
.side { display: grid; gap: 10px; min-width: 0; align-content: start; }
.ptag { display: flex; align-items: center; gap: 8px; font: 600 12px/1 var(--f-mono); color: var(--ink-3); }
.ptag b { color: var(--accent); font-size: 13px; }
.side.ms .ptag b { color: var(--pen); }
.crop { position: relative; width: 100%; background: #fff; border-radius: 6px; box-shadow: var(--page-shadow); overflow: hidden; }
.crop canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.side.ms .crop { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--pen) 35%, transparent), var(--page-shadow); }
.crop-err { position: absolute; inset: 0; display: grid; place-items: center; color: #6b7f92; font: 500 12px var(--f-mono); }
.reveal { display: grid; place-items: center; gap: 6px; min-height: 110px; width: 100%; border: 1.5px dashed var(--pen); border-radius: 8px; background: var(--pen-soft); color: var(--pen); cursor: pointer; font-weight: 600; padding: 16px; }
.reveal small { font-weight: 400; color: var(--ink-2); font-size: 12px; }
.note { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; font-size: 13px; min-width: 0; }
.note header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.note header b { font: 600 12px/1 var(--f-mono); margin-right: 2px; }
.note .ans { font: 500 13px/1.4 var(--f-mono); overflow-wrap: anywhere; }
.note details summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 12px; }
.note details[open] summary { margin-bottom: 8px; }
.note .blk + .blk { margin-top: 8px; }
.shared { font-size: 12px; color: var(--ink-3); padding: 6px 0; }
.mcq-ans { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 16px; background: var(--surface); border: 1.5px solid color-mix(in srgb, var(--pen) 45%, transparent); border-radius: 10px; padding: 14px 18px; }
.mcq-ans span { grid-column: 1 / -1; font: 600 10px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--pen); }
.mcq-ans b { font: 800 56px/1 var(--f-display); color: var(--pen); }
.mcq-ans p { margin: 0; color: var(--ink-2); font-size: 13px; min-width: 0; }
.qfoot { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--rule); padding-top: 18px; }
.qempty { padding: 40px 0; color: var(--ink-2); }
@media (max-width: 900px) {
  .qb { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .qnav { border-right: 0; border-bottom: 1px solid var(--rule); display: flex; overflow-x: auto; padding-block: 8px; padding-right: var(--gutter-r); gap: 12px; }
  .qnav .grp, .qnav .mcq { display: flex; gap: 3px; }
  .qnav .grp > span { display: none; }
  .qcard { padding-left: var(--gutter-l); }
  .colhead { display: none; }
  .qrowx { grid-template-columns: minmax(0, 1fr); gap: 12px; }
}

/* ---------- specification ---------- */
.spec-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.modbar { display: grid; gap: 8px; }
.modrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 13px; }
.modrow .track { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--rule); overflow: hidden; }
.modrow .track i { display: block; height: 100%; background: var(--accent); }
.modrow .v { font: 500 12px/1.4 var(--f-mono); color: var(--ink-2); }
.spec-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.spec-tools input { flex: 1 1 240px; font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); min-width: 0; }
.mod { display: grid; gap: 10px; margin-bottom: 28px; }
.mod > h4 { margin: 0; font: 800 20px/1.15 var(--f-display); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.mod > h4 small { font: 500 12px/1 var(--f-mono); color: var(--ink-3); }
.subsec { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.subsec > header { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.subsec > header b { font: 600 12px/1 var(--f-mono); color: var(--accent); }
.subsec > header span { font: 700 15px/1.2 var(--f-display); }
.subsec > header em { margin-left: auto; font: 500 11px/1 var(--f-mono); font-style: normal; color: var(--ink-3); }
.oc { border-top: 1px solid var(--rule); }
.oc:first-of-type { border-top: 0; }
.oc > button { width: 100%; border: 0; background: none; text-align: left; cursor: pointer; padding: 10px 14px; display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; }
.oc > button:hover { background: var(--surface-2); }
.oc > button[disabled] { cursor: default; }
.oc .code { font: 600 12px/1.3 var(--f-mono); color: var(--ink-2); }
.oc.child .code { padding-left: 14px; }
.oc .txt { font-size: 13px; line-height: 1.45; min-width: 0; }
.oc .stat { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.strip { display: flex; gap: 2px; }
.strip i { width: 7px; height: 14px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--rule); }
.strip i.on { background: var(--accent); border-color: var(--accent); }
.cnt { font: 600 12px/1 var(--f-mono); min-width: 64px; text-align: right; white-space: nowrap; }
.badge { font: 600 10px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 6px; border-radius: 4px; white-space: nowrap; }
.badge.never { color: var(--pen); background: var(--pen-soft); border: 1px solid color-mix(in srgb, var(--pen) 40%, transparent); }
.badge.rare { color: var(--ink-2); background: var(--surface-2); border: 1px dashed var(--ink-3); }
.oc-qs { padding: 4px 14px 14px 120px; display: grid; gap: 4px; }
.oc-q { display: grid; grid-template-columns: 170px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface-2); padding: 8px 10px; cursor: pointer; text-align: left; font-size: 13px; }

    io.observe(ref.current); return () => io.disconnect();

        }

const qnum = l => parseInt(l, 10);

}
function buildQuestions(reg, parts) {
  const qpU = (reg?.qp?.units || []).filter(u => u.segs.length);
  const msU = (reg?.ms?.units || []).filter(u => u.segs.length);
  const nums = [...new Set([...qpU.map(u => qnum(u.label)), ...parts.map(p => qnum(p.q))])].filter(n => !isNaN(n)).sort((a, b) => a - b);
  const seenPages = new Set();
  return nums.map(n => {
    const mine = l => qnum(l) === n;
    const rows = qpU.filter(u => mine(u.label)).map(u => ({ label: u.label, qp: u.segs, ms: [], parts: [] }));
    const rowLabels = rows.map(r => r.label);
    const qparts = parts.filter(p => mine(p.q));
    for (const p of qparts) {
      const base = p.q.replace(/\)\d+$/, ")");
      const a = ancestor(base, rowLabels);
      let row = rows.find(r => r.label === a);
      if (!row) { row = { label: base, qp: [], ms: [], parts: [] }; rows.push(row); rowLabels.push(base); }

      if (row) { row.ms.push(u); used.add(u.label); }
    }
    for (const row of rows) {
      if (row.ms.length || !row.parts.length) continue;
      // a parent mark-scheme row that covers several question parts
      const a = ancestor(row.label, msLabels);
      if (a) { const u = mineMs.find(x => x.label === a); if (!used.has(a)) { row.ms.push(u); used.add(a); } else row.shared = a; continue; }

      if (pg) { if (seenPages.has(pg)) row.sharedPage = pg; else { row.msPage = pg; seenPages.add(pg); } }

    return { n, rows, marks, parts: qparts, lor, mcq: qparts.length > 0 && qparts.every(p => p.type === "mcq") };
  });
}

            ${types.slice(0, 3).map(t => html`<span class="pill ty" key=${t}>${tl(t)}</span>`)}
          </div>
          <div class="nav">
            <button class="ib" aria-pressed=${practice} onClick=${() => setPractice(v => !v)} title="Hide each mark scheme until you reveal it">Practice mode</button>
            ${practice && html`<button class="ib" onClick=${revealAll} title="Reveal every mark scheme for this question (R)">Reveal all</button>`}
            <button class="ib" onClick=${() => goQ(cur - 1)} disabled=${cur === 0} aria-label="Previous question">←</button>
            <button class="ib" onClick=${() => goQ(cur + 1)} disabled=${cur >= qs.length - 1} aria-label="Next question">→</button>
          </div>
        </div>
        <div class="colhead"><span>Question</span><span>Mark scheme</span></div>
        ${q.rows.map(r => {
          const open = !practice || shown[key + r.label];
          const hasMs = r.ms.length || r.msPage || r.shared || r.sharedPage;
          return html`<div class="qrowx" key=${key + r.label} data-row=${r.label}>
            <div class="side qp">
              ${r.label !== String(q.n) || q.rows.length === 1 ? html`<div class="ptag"><b>${r.label}</b></div>` : null}
              ${r.qp.map((s, i) => html`<${Crop} key=${i} url=${qpUrl} seg=${s} box=${reg.qp} side="qp" />`)}
            </div>
            <div class="side ms">
              ${!hasMs && !r.parts.length ? null : !open ? html`<button class="reveal" onClick=${() => setShown(s => ({ ...s, [key + r.label]: true }))}>
                  Reveal mark scheme for ${r.label}<small>${r.parts.reduce((s, p) => s + (+p.marks || 0), 0)} marks · have a go first</small></button>` : html`
                ${q.mcq && r.parts[0]?.answer ? html`<div class="mcq-ans"><span>Answer</span><b>${(r.parts[0].answer.match(/^[A-D]\b/) || [r.parts[0].answer])[0]}</b><p>${r.parts[0].marking_points?.join(" ") || ""}</p></div>` : null}
                ${r.ms.filter(u => !(q.mcq && u.segs.every(s => s[2] - s[1] < 34))).map((u, i) => html`<div class="side" key=${u.label + i}>${r.ms.length > 1 || u.label !== r.label ? html`<div class="ptag"><b>${u.label}</b></div>` : null}${u.segs.map((s, j) => html`<${Crop} key=${j} url=${msUrl} seg=${s} box=${reg.ms} side="ms" />`)}</div>`)}
                ${r.msPage && html`<div class="ptag"><b>Mark scheme page ${r.msPage}</b></div><${Crop} url=${msUrl} seg=${[r.msPage, 0, 0]} box=${reg.ms} full=${true} side="ms" />`}
                ${r.shared && html`<div class="shared">Marked together with ${r.shared}, shown above.</div>`}
                ${r.sharedPage && html`<div class="shared">On mark scheme page ${r.sharedPage}, shown above.</div>`}`}
              ${r.parts.map(p => html`<${PartNote} key=${p.q} p=${p} showAnswer=${open} />`)}
            </div>
          </div>`;
        })}
        <div class="qfoot">
          <button class="ib" onClick=${() => goQ(cur - 1)} disabled=${cur === 0}>← ${cur > 0 ? "Question " + qs[cur - 1].n : ""}</button>
          <button class="ib" onClick=${() => goQ(cur + 1)} disabled=${cur >= qs.length - 1}>${cur < qs.length - 1 ? "Question " + qs[cur + 1].n : ""} →</button>
        </div>` : html`<div class="qempty">No questions found for this paper.</div>`}
    </div></div>
  </div>`;
}

/* ---------- Specification coverage ---------- */
const MODULES = { "1": "Development of practical skills in physics", "2": "Foundations of physics", "3": "Forces and motion", "4": "Electrons, waves and photons" };
function SpecView({ data, open, query }) {
  const ref = useRef(null); useLenis(ref);
  const spec = data.spec || { sections: {}, outcomes: [] };
  const [filter, setFilter] = useState("all"), [txt, setTxt] = useState(() => query?.q || ""), [openCode, setOpenCode] = useState(null), [paperF, setPaperF] = useState("all");
  const stats = useMemo(() => {
    const m = {};
    for (const o of spec.outcomes) m[o.code] = { parts: [], marks: 0, sessions: new Set() };
    for (const q of data.all) {
      if (q.withdrawn || (paperF !== "all" && String(q.paper) !== paperF)) continue;
      for (const c of q.spec_points || []) {
        const s = m[c]; if (!s) continue;
        s.parts.push(q); s.marks += +q.marks || 0; s.sessions.add(q.slug);
      }
    }
    // a parent outcome with roman children also counts its children's questions
    for (const o of spec.outcomes) {
      const kids = spec.outcomes.filter(k => k.code !== o.code && k.code.startsWith(o.code + "("));
      if (!kids.length) continue;
      const s = m[o.code]; const seen = new Set(s.parts);
      for (const k of kids) for (const q of m[k.code].parts) if (!seen.has(q)) { seen.add(q); s.parts.push(q); s.marks += +q.marks || 0; s.sessions.add(q.slug); }
    }
    for (const k in m) m[k].parts.sort((a, b) => SESSIONS.findIndex(s => s.slug === b.slug) - SESSIONS.findIndex(s => s.slug === a.slug) || a.paper - b.paper || cmpQ(a, b));
    return m;
  }, [data.all, spec, paperF]);
  const isParent = useMemo(() => new Set(spec.outcomes.filter(o => spec.outcomes.some(k => k.code.startsWith(o.code + "("))).map(o => o.code)), [spec]);
  const leafs = spec.outcomes.filter(o => !isParent.has(o.code));
  const covered = leafs.filter(o => stats[o.code]?.parts.length);
  const never = leafs.filter(o => !stats[o.code]?.parts.length);
  const rare = leafs.filter(o => { const n = stats[o.code]?.sessions.size || 0; return n > 0 && n <= 2; });
  const status = (c) => { const s = stats[c]; const n = s?.sessions.size || 0; return n === 0 ? "never" : n <= 2 ? "rare" : "ok"; };
  const sectionsBy = useMemo(() => {
    const out = {};
    for (const o of spec.outcomes) (out[o.section] ||= []).push(o);
    return out;
  }, [spec]);
  const modCov = Object.keys(MODULES).map(k => {
    const ls = leafs.filter(o => o.code.startsWith(k + ".")); const c = ls.filter(o => stats[o.code]?.parts.length).length;
    const marks = data.all.filter(q => (paperF === "all" || String(q.paper) === paperF) && (q.spec_points || [])[0]?.startsWith(k + ".")).reduce((s, q) => s + (+q.marks || 0), 0);
    return { k, n: ls.length, c, marks };
  });
  const s = txt.trim().toLowerCase();
  const show = (o) => {
    if (s && !(o.code.toLowerCase().includes(s) || o.text.toLowerCase().includes(s) || (spec.sections[o.section] || "").toLowerCase().includes(s))) return false;
    if (filter === "never") return status(o.code) === "never" && !isParent.has(o.code);
    if (filter === "rare") return status(o.code) === "rare" && !isParent.has(o.code);
    if (filter === "covered") return status(o.code) !== "never";
    if (filter === "must") return (stats[o.code]?.sessions.size || 0) >= 9;
    return true;
  };
  useEffect(() => {
    const c = query?.q; if (!c) return;
    setTxt(c);
    if (spec.outcomes.some(o => o.code === c)) setOpenCode(c);
  }, [query?.n]);
  const jump = (code) => { setOpenCode(code); setFilter("all"); setTxt(""); requestAnimationFrame(() => { const el = ref.current?.querySelector(`[data-code="${CSS.escape(code)}"]`); if (el) el.scrollIntoView({ block: "center", behavior: REDUCED ? "auto" : "smooth" }); }); };

  if (!spec.outcomes.length) return html`<div class="ins" ref=${ref}><div class="ins-inner"><div class="hero"><h2>Specification not loaded</h2></div></div></div>`;
  return html`<div class="ins" ref=${ref}><div class="ins-inner">
    <div class="hero">
      <span class="eyebrow">OCR A · H156 specification · ${leafs.length} learning outcomes</span>
      <h2>What the papers <em>cover</em>, and what they don't</h2>
      <p>Every past-paper question part is tagged with the learning outcomes it tests. Click any outcome to list every question on it, then open one to see it beside its mark scheme.</p>
      <div class="stats">
        <div class="stat"><b>${covered.length}</b><span>outcomes examined</span></div>
        <div class="stat"><b>${never.length}</b><span>never examined</span></div>
        <div class="stat"><b>${rare.length}</b><span>in only 1–2 sessions</span></div>
        <div class="stat"><b>${Math.round(covered.length / Math.max(1, leafs.length) * 100)}%</b><span>of the spec covered</span></div>
      </div>
    </div>

    <section class="spec-sum">
      <div class="panel">
        <h4>Coverage by module</h4>
        <div class="modbar">${modCov.map(m => html`<div class="modrow" key=${m.k} title=${`${m.c} of ${m.n} outcomes examined`}>
          <span>Module ${m.k} · ${MODULES[m.k]}</span><span class="v">${m.c}/${m.n}</span>
          <span class="track"><i style=${{ width: (m.c / Math.max(1, m.n) * 100) + "%" }}></i></span></div>`)}</div>
      </div>
      <div class="panel">
        <h4>Never examined (${never.length})</h4>
        ${never.length ? html`<div class="never-list">${never.map(o => html`<button key=${o.code} onClick=${() => jump(o.code)}><span class="c">${o.code}</span><span class="t">${o.text}</span></button>`)}</div>` : html`<p class="sub">Every outcome has come up at least once.</p>`}
      </div>
    </section>

    <section>
      <div class="spec-tools">
        <input id="spec-search" type="search" placeholder="Search the specification…" value=${txt} onInput=${e => setTxt(e.target.value)} aria-label="Search the specification" />
        <div class="seg" role="group" aria-label="Show">
          ${[["all", "All"], ["must", "Almost every year"], ["covered", "Examined"], ["rare", "Rarely examined"], ["never", "Never examined"]].map(([v, l]) => html`<button key=${v} aria-pressed=${filter === v} onClick=${() => setFilter(v)}><b>${l}</b></button>`)}
        </div>
        <div class="seg" role="group" aria-label="Paper">
          ${[["all", "Both papers"], ["1", "Paper 1"], ["2", "Paper 2"]].map(([v, l]) => html`<button key=${v} aria-pressed=${paperF === v} onClick=${() => setPaperF(v)}><b>${l}</b></button>`)}
        </div>
      </div>
      ${Object.keys(MODULES).map(mk => {
        const subs = Object.keys(sectionsBy).filter(c => c.startsWith(mk + ".")).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
        const visible = subs.filter(sc => sectionsBy[sc].some(show));
        if (!visible.length) return null;
        return html`<div class="mod" key=${mk}>
          <h4>Module ${mk}: ${MODULES[mk]}</h4>
          ${visible.map(sc => {
            const os = sectionsBy[sc]; const lf = os.filter(o => !isParent.has(o.code)); const cov = lf.filter(o => stats[o.code]?.parts.length).length;
            const parentTitle = spec.sections[sc.split(".").slice(0, 2).join(".")] || "";
            return html`<div class="subsec" key=${sc}>
              <header><b>${sc}</b><span>${spec.sections[sc] || ""}</span><em>${parentTitle} · ${cov}/${lf.length} examined</em></header>
              ${os.filter(show).map(o => {
                const st = stats[o.code]; const n = st.parts.length; const on = openCode === o.code; const stt = status(o.code); const child = /\)\([ivx]+\)$/.test(o.code);
                return html`<div class=${"oc" + (child ? " child" : "")} key=${o.code} data-code=${o.code}>
                  <button onClick=${() => n && setOpenCode(on ? null : o.code)} aria-expanded=${n ? on : null} disabled=${!n}>
                    <span class="code">${o.code}</span>
                    <span class="txt">${o.text}</span>
                    <span class="stat">
                      ${stt === "never" ? html`<span class="badge never">Never examined</span>` : stt === "rare" ? html`<span class="badge rare">Rare</span>` : null}
                      <span class="strip" aria-label=${`Examined in ${st.sessions.size} of ${SESSIONS.length} sessions`}>${SESSIONS.map(se => html`<i key=${se.slug} class=${st.sessions.has(se.slug) ? "on" : ""} title=${se.label}></i>`)}</span>
                      <span class="cnt">${n ? `${n} part${n === 1 ? "" : "s"}` : "—"}</span>
                    </span>
                  </button>
                  ${on && html`<div class="oc-qs">
                    <span class="shared">${n} question part${n === 1 ? "" : "s"} · ${st.marks} marks · ${st.sessions.size} session${st.sessions.size === 1 ? "" : "s"}</span>
                    ${st.parts.map(q => html`<button class="oc-q" key=${q.paper + q.slug + q.q} onClick=${() => open(q.paper, q.slug, q)}>
                      <span class="ref">P${q.paper} · ${SLABEL[q.slug]} · Q${q.q}</span>
                      <span class="ctx">${q.context}</span>
                      <span class="mk">${q.marks} m</span>
                    </button>`)}
                  </div>`}
                </div>`;
              })}
            </div>`;
          })}
        </div>`;
      })}
    </section>
  </div></div>`;
}

/* ---------- Exam playbook ---------- */
function Playbook({ data, open, openSpec }) {
  const ref = useRef(null); const lenis = useLenis(ref);
  const pb = data.playbook || {};
  const all = useMemo(() => data.all.filter(q => !q.withdrawn), [data.all]);
  const [done, setDone] = useState(() => store.get("revised", {}));
  useEffect(() => { store.set("revised", done); }, [done]);
  const specText = useMemo(() => Object.fromEntries((data.spec?.outcomes || []).map(o => [o.code, o.text])), [data.spec]);

  const profile = useMemo(() => [1, 2].map(p => {
    const qs = all.filter(q => q.paper === p); const m = qs.reduce((s, q) => s + (+q.marks || 0), 0);
    const by = {}; for (const q of qs) by[q.type] = (by[q.type] || 0) + (+q.marks || 0);
    const mods = {}; for (const q of qs) { const k = (q.spec_points?.[0] || "?")[0]; mods[k] = (mods[k] || 0) + (+q.marks || 0); }
    return { p, m, types: Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 6), mods };
  }), [all]);
  const must = useMemo(() => {
    const ses = {}, parts = {};
    for (const q of all) for (const c of q.spec_points || []) { (ses[c] ||= new Set()).add(q.slug); parts[c] = (parts[c] || 0) + 1; }
    return Object.keys(ses).filter(c => ses[c].size >= 9).sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).map(c => ({ c, n: ses[c].size, parts: parts[c] }));
  }, [all]);
  const lor = useMemo(() => all.filter(q => q.type === "level-of-response").sort((a, b) => SESSIONS.findIndex(s => s.slug === b.slug) - SESSIONS.findIndex(s => s.slug === a.slug)), [all]);
  const eqs = useMemo(() => { const m = {}; for (const q of all) for (const e of q.equations || []) { const k = e.trim(); m[k] = (m[k] || 0) + 1; } return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 30); }, [all]);
  const trend = useMemo(() => SESSIONS.map(s => {
    const qs = all.filter(q => q.slug === s.slug); const m = qs.reduce((t, q) => t + (+q.marks || 0), 0) || 1;
    const pr = qs.filter(q => (q.spec_points || []).some(c => c.startsWith("1.") || c.startsWith("2.2"))).reduce((t, q) => t + (+q.marks || 0), 0);
    return { s, pct: Math.round(pr / m * 100) };
  }), [all]);
  const maxT = Math.max(...trend.map(t => t.pct), 1);
  const mcqN = all.filter(q => q.type === "mcq").length;
  const letters = useMemo(() => { const m = { A: 0, B: 0, C: 0, D: 0 }; for (const q of all) if (q.type === "mcq") { const l = (q.answer || "").match(/^[A-D]/)?.[0]; if (l) m[l]++; } return m; }, [all]);

  const SECTIONS = [["pb-papers", "The two papers"], ["pb-mech", "How marks are awarded"], ["pb-cmd", "Command words"], ["pb-prac", "Practical skills"], ["pb-lor", "Six-mark questions"], ["pb-must", "Must-know outcomes"], ["pb-traps", "Topic traps"], ["pb-units", "Unit conversions"], ["pb-eq", "Equation bank"], ["pb-mcq", "Multiple choice"], ["pb-trend", "Trends"]];
  const goto = (id) => { const el = ref.current?.querySelector("#" + id); if (!el) return; lenis.current ? lenis.current.scrollTo(el, { offset: -12 }) : el.scrollIntoView(); };
  const L = (arr) => html`<ul>${arr.map((x, i) => html`<li key=${i}>${x}</li>`)}</ul>`;
  const lbl = (p) => p === "1" ? "M1 Practical" : p === "2" ? "M2 Foundations" : p === "3" ? "M3 Forces" : p === "4" ? "M4 Electrons, waves, photons" : p;

  if (!pb.mechanics) return html`<div class="ins" ref=${ref}><div class="ins-inner"><div class="hero"><h2>Playbook not loaded</h2></div></div></div>`;
  return html`<div class="ins" ref=${ref}><div class="ins-inner">
    <div class="hero">
      <span class="eyebrow">OCR A · H156 · exam playbook</span>
      <h2>How to <em>answer</em> these papers</h2>
      <p>${pb.intro}</p>
      <p style=${{ fontSize: "14px" }}>${pb.timing}</p>
    </div>
    <div class="pb">
      <nav class="pb-toc" aria-label="Playbook sections"><span>On this page</span>${SECTIONS.map(([id, t]) => html`<button key=${id} onClick=${() => goto(id)}>${t}</button>`)}</nav>
      <div class="pb-body">

        <section id="pb-papers">
          <h3>The two papers reward different things</h3>
          <p class="sub">Share of all marks across every session, by question type and by spec module.</p>
          <div class="cols2">${profile.map(pp => html`<div class="panel" key=${pp.p}>
            <h4>${PAPERS[pp.p].name} · ${PAPERS[pp.p].sub}</h4>
            <table class="prof"><thead><tr><th>Question type</th><th style=${{ textAlign: "right" }}>Share</th></tr></thead><tbody>
              ${pp.types.map(([t, m]) => html`<tr key=${t}><td>${tl(t)}</td><td class="n"><span class="bar2" style=${{ width: Math.round(m / pp.m * 160) + "px" }}></span>${Math.round(m / pp.m * 100)}%</td></tr>`)}
            </tbody></table>
            <table class="prof" style=${{ marginTop: "14px" }}><thead><tr><th>Main module tested</th><th style=${{ textAlign: "right" }}>Share</th></tr></thead><tbody>
              ${["4", "3", "1", "2"].filter(k => pp.mods[k]).map(k => html`<tr key=${k}><td>${lbl(k)}</td><td class="n">${Math.round(pp.mods[k] / pp.m * 100)}%</td></tr>`)}
            </tbody></table>
          </div>`)}</div>
          <p class="sub" style=${{ marginTop: "14px" }}>Paper 1 is won on recall and precise wording: multiple choice and explanations together outweigh the calculations. Paper 2 is won on working and the two six-mark answers. Module 4 outweighs Module 3 on both.</p>
        </section>

        <section id="pb-mech">
          <h3>How marks are actually awarded</h3>
          <p class="sub">Habits of the mark schemes that you can use to your advantage.</p>
          <div class="cards2">${pb.mechanics.map((r, i) => html`<div class="rule" key=${i}><h4>${r.title}</h4><p>${r.body}</p><span class="st">${r.stat}</span></div>`)}</div>
        </section>

        <section id="pb-cmd">
          <h3>What each command word needs</h3>
          <div class="panel"><dl class="cmd">${pb.commands.map(c => html`<${React.Fragment} key=${c.word}><dt>${c.word}</dt><dd>${c.need}</dd></${React.Fragment}>`)}</dl></div>
        </section>

        <section id="pb-prac">
          <h3>Practical skills: the biggest single source of marks</h3>
          <p class="sub">Analysis skills (1.1.3) carry more marks than any physics sub-section, and planning (1.1.1) is close behind. They turn up inside ordinary physics questions.</p>
          <div class="cards2">${pb.practical.map((r, i) => html`<div class="rule" key=${i}><h4>${r.title}</h4><p>${r.body}</p></div>`)}</div>
        </section>

        <section id="pb-lor">
          <h3>Six-mark questions</h3>
          <p class="sub">${pb.lor.summary}</p>
          <div class="cols2">
            <div class="panel"><h4>Level 3 checklist for a practical plan</h4><ol class="check">${pb.lor.checklist.map((c, i) => html`<li key=${i}>${c}</li>`)}</ol>
              <p class="sub" style=${{ margin: "14px 0 0" }}>${pb.lor.note}</p></div>
            <div class="panel"><h4>All ${lor.length} six-mark questions</h4>
              <div class="lorq">${lor.map(q => html`<button class="oc-q" style=${{ gridTemplateColumns: "150px minmax(0,1fr)" }} key=${q.paper + q.slug + q.q} onClick=${() => open(q.paper, q.slug, q)}>
                <span class="ref">${SLABEL[q.slug]} · Q${q.q}</span><span class="ctx">${q.context}</span></button>`)}</div></div>
          </div>
        </section>

        <section id="pb-must">
          <h3>Must-know: examined in at least 9 of 11 sessions</h3>
          <p class="sub">${must.length} learning outcomes come up almost every year. Tick them off as you revise; ticks are saved in this browser only.</p>
          <div class="panel"><div class="must">${must.map(m => html`<label key=${m.c} class=${done[m.c] ? "done" : ""}>
            <input type="checkbox" id=${"must-" + m.c} checked=${!!done[m.c]} onChange=${e => setDone(d => ({ ...d, [m.c]: e.target.checked }))} />

            <button class="link n" onClick=${e => { e.preventDefault(); openSpec(m.c); }}>${m.n}/11 · ${m.parts} parts →</button></label>`)}</div>
            <p class="sub" style=${{ margin: "12px 0 0" }}>${Object.values(done).filter(Boolean).length} of ${must.length} ticked.</p></div>
        </section>

        <section id="pb-traps">
          <h3>Topic traps from the mark schemes</h3>

            <header><b>${t.spec}</b><h4>${t.topic}</h4></header>${L(t.items)}

        </section>

        </section>

        <section id="pb-eq">

          <div class="panel">${L(pb.mcq)}</div>
        </section>

        <section id="pb-trend">
          <h3>Practical and uncertainty marks by session</h3>
          <p class="sub">Share of each session's marks (both papers) on Module 1 practical skills and 2.2 uncertainties. It has stayed between about a fifth and a third, peaking in recent sessions.</p>
          <div class="panel">
            <div class="trend" role="img" aria-label="Practical marks share by session">${trend.map(t => html`<div key=${t.s.slug} style=${{ height: (t.pct / maxT * 100) + "%" }} title=${`${t.s.label}: ${t.pct}%`}><span>${t.pct}%</span></div>`)}</div>
            <div class="trend-x">${trend.map(t => html`<span key=${t.s.slug}>${t.s.y === "SAM" ? "SAM" : (t.s.m === "Nov" ? "N" : "J") + t.s.y.slice(2)}</span>`)}</div>
          </div>
        </section>
      </div>
    </div>
  </div></div>`;
}

/* ---------- Insights ---------- */
function Insights({ data, open }) {
  const ref = useRef(null); useLenis(ref);
  const { all, ins } = data;
  const [fPaper, setFPaper] = useState("all"), [fType, setFType] = useState("all"), [fMod, setFMod] = useState("all"), [qtxt, setQtxt] = useState("");
  const [openRow, setOpenRow] = useState(null), [limit, setLimit] = useState(40), [heatPaper, setHeatPaper] = useState("all");
  const exRef = useRef(null);
  useEffect(() => {
    if (REDUCED) return;
    gsap.from(ref.current.querySelectorAll(".hero > *"), { y: 22, opacity: 0.15, duration: 0.8, stagger: 0.08, ease: "power3.out", clearProps: "opacity,transform" });
    gsap.from(ref.current.querySelectorAll(".tcard"), { y: 26, opacity: 0.2, duration: 0.7, stagger: 0.04, ease: "power2.out", delay: 0.2, clearProps: "opacity,transform" });
  }, []);

  const totalMarks = all.reduce((s, q) => s + (+q.marks || 0), 0);
  const papersN = new Set(all.map(q => q.paper + q.slug)).size;
  const typeStats = useMemo(() => {
    const m = {};
    for (const q of all) {
      const t = q.type || "other"; const o = m[t] ||= { type: t, n: 0, marks: 0, cw: {}, diff: 0 };
      o.n++; o.marks += +q.marks || 0; o.diff += +q.difficulty || 0;
      const c = (q.command_word || "").trim(); if (c) o.cw[c] = (o.cw[c] || 0) + 1;
    }
    return Object.values(m).sort((a, b) => b.marks - a.marks);
  }, [all]);
  const maxTypeMarks = Math.max(1, ...typeStats.map(t => t.marks));
  const insByType = Object.fromEntries((ins.types || []).map(t => [t.type, t]));

  const modules = useMemo(() => [...new Set(all.map(q => q.topic_module).filter(Boolean))].sort(), [all]);
  const heat = useMemo(() => {
    const rows = {}; const src = heatPaper === "all" ? all : all.filter(q => String(q.paper) === heatPaper);
    for (const q of src) {
      const t = (q.topic || "Unassigned").trim(); const r = rows[t] ||= { topic: t, cells: {}, tot: 0 };
      r.cells[q.slug] = (r.cells[q.slug] || 0) + (+q.marks || 0); r.tot += +q.marks || 0;
    }
    const list = Object.values(rows).sort((a, b) => a.topic.localeCompare(b.topic, undefined, { numeric: true }));
    const max = Math.max(1, ...list.flatMap(r => Object.values(r.cells)));
    return { list, max };
  }, [all, heatPaper]);
  const shade = (v, max) => {
    if (!v) return { background: "var(--surface-2)", color: "var(--ink-3)" };
    const step = Math.min(5, Math.ceil(v / max * 5)); const pct = [0, 14, 28, 46, 66, 88][step];
    return { background: `color-mix(in srgb, var(--accent) ${pct}%, var(--surface))`, color: step >= 4 ? "var(--surface)" : "var(--ink)" };
  };
  const cwStats = useMemo(() => {
    const m = {}; for (const q of all) { const c = (q.command_word || "").trim(); if (!c || q.type === "mcq") continue; const o = m[c] ||= { c, n: 0, marks: 0 }; o.n++; o.marks += +q.marks || 0; }
    return Object.values(m).sort((a, b) => b.marks - a.marks).slice(0, 14);
  }, [all]);
  const maxCw = Math.max(1, ...cwStats.map(c => c.marks));

  const filtered = useMemo(() => {
    const s = qtxt.trim().toLowerCase();
    return all.filter(q => (fPaper === "all" || String(q.paper) === fPaper) && (fType === "all" || q.type === fType || (q.secondary_types || []).includes(fType)) && (fMod === "all" || q.topic_module === fMod)
      && (!s || [q.context, q.topic, q.subtopic, q.answer, ...(q.equations || []), ...(q.marking_points || [])].join(" ").toLowerCase().includes(s)));
  }, [all, fPaper, fType, fMod, qtxt]);
  const showType = (t) => { setFType(t); setLimit(40); setOpenRow(null); requestAnimationFrame(() => exRef.current?.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth" })); };

  const L = (arr) => arr && arr.length ? html`<ul>${arr.map((x, i) => html`<li key=${i}>${x}</li>`)}</ul>` : null;
  const refBtn = (r) => html`<button class="link" onClick=${() => open(r.paper, r.slug, all.find(q => q.paper == r.paper && q.slug === r.slug && q.q === r.q))}>P${r.paper} ${SLABEL[r.slug] || r.slug} · Q${r.q}</button>`;

  if (!all.length) return html`<div class="ins" ref=${ref}><div class="ins-inner"><div class="hero"><span class="eyebrow">Insights</span><h2>Analysis is still being compiled</h2><p>The question-by-question analysis hasn't been added to this page yet. The paper viewer works in the meantime.</p></div></div></div>`;

  return html`
  <div class="ins" ref=${ref}><div class="ins-inner">
    <div class="hero">
      <${Wave} k=${70} speed=${1.1} />
      <span class="eyebrow">OCR A · H156 · ${papersN} papers read line by line</span>
      <h2>What the mark scheme <em>actually</em> pays for</h2>
      <p>${ins.headline || "Every question part from both AS papers, tagged by type, topic and command word, with the creditworthy points, the allow/reject rules and the usual ways marks are lost."}</p>
      <div class="stats">
        <div class="stat"><b>${all.length}</b><span>question parts</span></div>
        <div class="stat"><b>${totalMarks}</b><span>marks analysed</span></div>
        <div class="stat"><b>${typeStats.length}</b><span>question types</span></div>
        <div class="stat"><b>${heat.list.length}</b><span>spec topics hit</span></div>
      </div>
    </div>

    <section>
      <h3>Question types, by marks on offer</h3>
      <p class="sub">The bar shows each type's share of all marks across every paper. Each card says what examiners credit and where candidates drop marks.</p>
      <div class="types">
        ${typeStats.map(t => { const x = insByType[t.type] || {}; const cws = Object.entries(t.cw).sort((a, b) => b[1] - a[1]).slice(0, 5);
          return html`<article class="tcard" key=${t.type}>
            <header><h4>${x.label || tl(t.type)}</h4><span class="n">${t.n} parts</span></header>
            <div class="meter" title=${`${t.marks} marks`}><i style=${{ width: (t.marks / maxTypeMarks * 100) + "%" }}></i></div>
            <div class="tmeta"><span><b>${(t.marks / totalMarks * 100).toFixed(1)}%</b> of marks</span><span><b>${(t.marks / t.n).toFixed(1)}</b> avg marks</span><span><b>${(t.diff / t.n).toFixed(1)}</b>/3 difficulty</span></div>
            ${x.summary && html`<p>${x.summary}</p>`}
            ${x.what_ms_wants?.length ? html`<div class="blk"><span class="h">What the mark scheme wants</span>${L(x.what_ms_wants)}</div>` : null}
            ${x.how_to_score?.length ? html`<div class="blk"><span class="h">How to score full marks</span>${L(x.how_to_score)}</div>` : null}
            ${x.pitfalls?.length ? html`<div class="blk pen"><span class="h">Where marks are lost</span>${L(x.pitfalls)}</div>` : null}
            ${cws.length ? html`<div class="cw">${cws.map(([c, n]) => html`<span key=${c}>${c} ×${n}</span>`)}</div>` : null}
            <button class="link" onClick=${() => showType(t.type)}>See all ${t.n} ${(x.label || tl(t.type)).toLowerCase()} parts →</button>
          </article>`; })}
      </div>
    </section>

    ${(ins.patterns || []).length ? html`<section>
      <h3>Questions that keep coming back</h3>
      <p class="sub">Set-ups OCR reuses across sessions, with what the mark scheme expects each time.</p>
      <div class="patterns">${ins.patterns.map((p, i) => html`<div class="panel" key=${i}>
        <h4>${p.title}</h4>
        <div class="blk"><span class="h">${p.topic || "Pattern"}</span><p style=${{ margin: 0, fontSize: "13px", color: "var(--ink-2)" }}>${p.detail}</p></div>
        ${p.ms_expects?.length ? html`<div class="blk" style=${{ marginTop: "10px" }}><span class="h">Mark scheme expects</span>${L(p.ms_expects)}</div>` : null}
        ${p.refs?.length ? html`<div style=${{ display: "grid", gap: "4px", marginTop: "10px" }}>${p.refs.slice(0, 6).map((r, j) => html`<span key=${j}>${refBtn(r)}</span>`)}</div>` : null}
      </div>`)}</div>
    </section>` : null}

    <section>
      <h3>Where the marks sit in the specification</h3>
      <p class="sub">Marks per spec topic in each session. Darker cells carry more marks.</p>
      <div class="seg" style=${{ marginBottom: "12px" }}>
        ${["all", "1", "2"].map(v => html`<button key=${v} aria-pressed=${heatPaper === v} onClick=${() => setHeatPaper(v)}><b>${v === "all" ? "Both papers" : "Paper " + v}</b></button>`)}
      </div>
      <div class="heat-wrap"><table class="heat">
        <thead><tr><th></th>${SESSIONS.map(s => html`<th key=${s.slug}>${s.m === "Specimen" ? "SAM" : (s.m === "Nov" ? "N" : "J") + s.y.slice(2)}</th>`)}<th>Total</th></tr></thead>
        <tbody>${heat.list.map(r => html`<tr key=${r.topic}><th class="row" title=${r.topic}>${r.topic}</th>
          ${SESSIONS.map(s => { const v = r.cells[s.slug] || 0; return html`<td key=${s.slug} style=${shade(v, heat.max)} title=${`${r.topic} · ${s.label}: ${v} mark${v === 1 ? "" : "s"}`}>${v || ""}</td>`; })}
          <td class="tot">${r.tot}</td></tr>`)}</tbody>
      </table>
      <div class="legend"><span>Fewer marks</span><span class="ramp">${[14, 28, 46, 66, 88].map(p => html`<i key=${p} style=${{ background: `color-mix(in srgb, var(--accent) ${p}%, var(--surface))` }}></i>`)}</span><span>More marks</span></div>
      </div>
    </section>

    <section class="cols2">
      <div class="panel">
        <h4>Command words, by marks</h4>
        <div class="bars">${cwStats.map(c => html`<div class="bar" key=${c.c} title=${`${c.c}: ${c.marks} marks over ${c.n} parts`}>
          <span>${c.c}</span><span class="track"><i style=${{ width: (c.marks / maxCw * 100) + "%" }}></i></span><span class="v">${c.marks} m</span></div>`)}</div>
        ${(ins.command_words || []).length ? html`<dl class="codes" style=${{ marginTop: "16px" }}>${ins.command_words.map(c => html`<${React.Fragment} key=${c.word}><dt style=${{ color: "var(--accent)" }}>${c.word}</dt><dd>${c.ms_expects}</dd></${React.Fragment}>`)}</dl>` : null}
      </div>
      <div class="panel">
        <h4>Reading the mark scheme</h4>
        ${(ins.conventions || []).length ? html`<dl class="codes">${ins.conventions.map(c => html`<${React.Fragment} key=${c.code}><dt>${c.code}</dt><dd>${c.meaning}</dd></${React.Fragment}>`)}</dl>` : html`<p class="sub">Conventions will appear here.</p>`}
      </div>
    </section>

    ${(ins.golden_rules || []).length ? html`<section>
      <h3>Rules that apply to every paper</h3>
      <div class="panel">${L(ins.golden_rules)}</div>
    </section>` : null}

    <section class="explorer" ref=${exRef}>
      <h3>Every question part</h3>
      <p class="sub">${filtered.length} of ${all.length} parts. Open one to see the marking points, then jump straight to it in the viewer.</p>
      <div class="filters">
        <input id="q-search" type="search" placeholder="Search topics, equations, answers…" value=${qtxt} onInput=${e => { setQtxt(e.target.value); setLimit(40); }} aria-label="Search questions" />
        <select id="q-paper" value=${fPaper} onChange=${e => setFPaper(e.target.value)} aria-label="Paper"><option value="all">Both papers</option><option value="1">Paper 1</option><option value="2">Paper 2</option></select>
        <select id="q-type" value=${fType} onChange=${e => setFType(e.target.value)} aria-label="Question type"><option value="all">All types</option>${typeStats.map(t => html`<option key=${t.type} value=${t.type}>${(insByType[t.type] || {}).label || tl(t.type)}</option>`)}</select>
        <select id="q-mod" value=${fMod} onChange=${e => setFMod(e.target.value)} aria-label="Module"><option value="all">All modules</option>${modules.map(m => html`<option key=${m} value=${m}>${m}</option>`)}</select>
      </div>
      <div class="qrows">
        ${filtered.slice(0, limit).map(q => { const id = q.paper + q.slug + q.q; const on = openRow === id; return html`
          <div class="qrow" key=${id}>
            <button onClick=${() => setOpenRow(on ? null : id)} aria-expanded=${on}>
              <span class="ref">P${q.paper} · Q${q.q}<small>${SLABEL[q.slug]}</small></span>
              <span class="ctx">${q.context}<small>${tl(q.type)} · ${q.topic || ""}${q.command_word ? " · " + q.command_word : ""}</small></span>
              <span class="mk">${q.marks} m</span>
            </button>
            ${on && html`<div class="qdetail">
              <div class="blk"><span class="h">Answer</span><span class="ans">${q.answer || "—"}</span>
                ${q.equations?.length ? html`<span class="h" style=${{ marginTop: "8px" }}>Equations</span><span class="ans">${q.equations.join("  ·  ")}</span>` : null}
                <button class="link" style=${{ marginTop: "8px" }} onClick=${() => open(q.paper, q.slug, q)}>Open in the viewer →</button></div>
              <div class="blk"><span class="h">Marking points</span>${L(q.marking_points)}</div>
              ${q.allow_reject_ignore?.length ? html`<div class="blk"><span class="h">Allow / reject / ignore</span>${L(q.allow_reject_ignore)}</div>` : null}
              ${q.pitfalls?.length ? html`<div class="blk pen"><span class="h">Pitfalls</span>${L(q.pitfalls)}</div>` : null}
            </div>`}
          </div>`; })}
      </div>
      ${filtered.length > limit && html`<button class="btn more" onClick=${() => setLimit(l => l + 80)}>Show ${Math.min(80, filtered.length - limit)} more</button>`}
    </section>
  </div></div>`;
}

/* ---------- App ---------- */
function App() {
  const [data, setData] = useState({ all: [], byPaper: {}, ins: {}, regions: {}, ready: false });
  const init = store.get("sel", { paper: 1, slug: "jun2024" });
  const [sel, setSel] = useState({ paper: init.paper || 1, slug: SLABEL[init.slug] ? init.slug : "jun2024", q: null, nonce: 0 });
  const fromHash = () => ({ "#insights": "insights", "#paper": "paper", "#spec": "spec", "#playbook": "playbook" })[location.hash] || "questions";
  const [specQ, setSpecQ] = useState({ q: "", n: 0 });
  const [view, setView] = useState(fromHash);
  useEffect(() => { store.set("sel", { paper: sel.paper, slug: sel.slug }); }, [sel.paper, sel.slug]);
  useEffect(() => {
    const h = () => setView(fromHash());
    addEventListener("hashchange", h); return () => removeEventListener("hashchange", h);
  }, []);
  const go = v => { setView(v); try { history.replaceState(null, "", "#" + v); } catch {} };
  useEffect(() => {
    Promise.all([
      fetch("data/questions.json").then(r => r.ok ? r.json() : []).catch(() => []),
      fetch("data/insights.json").then(r => r.ok ? r.json() : {}).catch(() => ({})),
      fetch("data/regions.json").then(r => r.ok ? r.json() : {}).catch(() => ({})),
      fetch("data/spec.json").then(r => r.ok ? r.json() : null).catch(() => null),
      fetch("data/playbook.json").then(r => r.ok ? r.json() : null).catch(() => null),
    ]).then(([all, ins, regions, spec, playbook]) => {
      const byPaper = {}; for (const q of all) (byPaper[`${q.paper}:${q.slug}`] ||= []).push(q);
      setData({ all, byPaper, ins, regions, spec, playbook, ready: true });
    });
  }, []);
  const openSpec = (code) => { setSpecQ(o => ({ q: code, n: o.n + 1 })); go("spec"); };
  const open = (paper, slug, q) => { setSel(s => ({ paper: +paper, slug, q: q || null, nonce: s.nonce + 1 })); go("questions"); };

  return html`
    <div class="app">
      <header class="top">
        <${Wave} k=${46} speed=${1.6} />
        <div class="brand"><span class="code">H156</span><h1>Paper Bench <span>OCR A · AS Physics</span></h1></div>
        <nav class="tabs" aria-label="View">
          <button aria-pressed=${view === "questions"} onClick=${() => go("questions")}>Questions</button>
          <button aria-pressed=${view === "paper"} onClick=${() => go("paper")}>Whole paper</button>
          <button aria-pressed=${view === "spec"} onClick=${() => go("spec")}>Spec</button>
          <button aria-pressed=${view === "playbook"} onClick=${() => go("playbook")}>Playbook</button>
          <button aria-pressed=${view === "insights"} onClick=${() => go("insights")}>Insights</button>
        </nav>
      </header>
      ${view === "questions" || view === "paper" ? html`
        <div class="rail">
          <div class="seg" role="group" aria-label="Paper">
            ${[1, 2].map(p => html`<button key=${p} aria-pressed=${sel.paper === p} onClick=${() => setSel(s => ({ ...s, paper: p, q: null }))}><b>${PAPERS[p].name}</b><small>${PAPERS[p].sub}</small></button>`)}
          </div>
          <div class="sessions" role="group" aria-label="Exam session">
            ${SESSIONS.map(s => html`<button key=${s.slug} class="chip" aria-pressed=${sel.slug === s.slug} onClick=${() => setSel(o => ({ ...o, slug: s.slug, q: null }))} title=${s.label}><span class="y">${s.y}</span><span class="m">${s.m}</span></button>`)}
          </div>
        </div>
        ${view === "paper" ? html`<${Bench} data=${data} sel=${sel} setSel=${setSel} />` : data.ready ? html`<${QBench} data=${data} sel=${sel} />` : html`<div class="loading" style=${{ position: "static", padding: "40px" }}>Loading questions…</div>`}` : html`<div style=${{ display: "contents" }}><div></div>${view === "spec" ? html`<${SpecView} data=${data} open=${open} query=${specQ} />` : view === "playbook" ? html`<${Playbook} data=${data} open=${open} openSpec=${openSpec} />` : html`<${Insights} data=${data} open=${open} />`}</div>`}
    </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
